name: Build and Deploy on EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy using SSM
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceids,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --parameters commands='[
              "cd /home/ec2-user || exit",
              "rm -rf springboot-app || true",
              "git clone https://github.com/YOUR_USERNAME/YOUR_REPO.git springboot-app",
              "cd springboot-app",
              "docker stop springboot-container || true",
              "docker rm springboot-container || true",
              "docker build -t springboot-app .",
              "docker run -d -p 8080:8080 --name springboot-container springboot-app"
            ]'
