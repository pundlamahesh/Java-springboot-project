name: Build Backend & Frontend on EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy using SSM
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceids,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --parameters commands='[
              "cd /home/ec2-user || exit",
              "rm -rf myapp || true",
              "git clone https://github.com/pundlamahesh/Java-springboot-project.git myapp",
              "cd myapp",
              
              "docker stop backend || true",
              "docker rm backend || true",
              "docker stop frontend || true",
              "docker rm frontend || true",

              "cd backend",
              "docker build -t backend .",
              "cd ..",

              "cd frontend",
              "docker build -t frontend .",
              "cd ..",

              "docker run -dt -p 8084:8084 --name backend backend",
              "docker run -dt -p 8501:8501 --name frontend frontend"
            ]'
